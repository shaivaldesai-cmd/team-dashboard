<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll Sales · Home</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #0b0d12; --ink-2: #3d4350; --ink-3: #7a8190;
    --line: #e7e9ee; --line-2: #f2f3f6; --panel: #fafbfc;
    --accent: #2457e6; --accent-2: #edf2ff;
    --good: #12805c; --bad: #c2352b;
    --radius: 14px;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
               -webkit-font-smoothing: antialiased; }

  .top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1200px; margin: 0 auto; padding: 0 28px; height: 60px; display: flex; align-items: center; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; }
  .brand span { color: var(--ink-3); font-weight: 500; }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  nav a { font-size: 13.5px; color: var(--ink-3); text-decoration: none; padding: 7px 11px; border-radius: 8px; white-space: nowrap; }
  nav a.on { color: var(--ink); background: var(--line-2); font-weight: 500; }

  main { max-width: 1200px; margin: 0 auto; padding: 40px 28px 80px; display: grid; gap: 28px; }

  .hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
  h1 { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: #fff; }
  .toggle button { all: unset; cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 6px; color: var(--ink-3); }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .changes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  .changes-l { font-size: 12.5px; color: var(--ink-3); margin-right: 2px; }
  .chip { font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: default; }
  .chip.now { border-color: #f0d9ab; background: #fffaf0; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: grid; gap: 22px; }
  .card-h { display: flex; align-items: center; gap: 8px; }
  .team { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }

  .stars { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  #s-und-m { grid-column: 1 / -1; }
  .star { padding: 16px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line-2); display: grid; gap: 4px; }
  .star-l { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
  .vals { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  .vals > div { display: grid; }
  .cur { font-size: 40px; line-height: 1.05; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .prev { font-size: 28px; line-height: 1.05; font-weight: 500; letter-spacing: -.02em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .per { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .chg { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .chg.good { color: var(--good); } .chg.bad { color: var(--bad); }
  .chg small { color: var(--ink-3); font-weight: 400; font-size: 12.5px; }

  .tbl-h { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  thead th { font-size: 12.5px; font-weight: 500; color: var(--ink-3); border-bottom: 1px solid var(--line); }
  tbody tr.main td:first-child { font-weight: 500; }
  tbody tr.sub td { color: var(--ink-3); font-size: 13.5px; }
  tbody tr.sub td:first-child { padding-left: 16px; }
  tbody tr.total td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }
  td.c { font-weight: 500; }

  footer { font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 16px; }

  .i { width: 17px; height: 17px; border-radius: 50%; border: 1px solid #c9ced6; color: var(--ink-3); font: 600 10.5px/15px var(--sans);
       display: inline-grid; place-items: center; cursor: help; background: #fff; padding: 0; flex: none; }
  .i:hover, .i:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  #tip { position: fixed; z-index: 50; pointer-events: none; max-width: 300px; background: var(--ink); color: #fff; font-size: 12.5px; line-height: 1.45;
         padding: 9px 11px; border-radius: 9px; box-shadow: 0 8px 24px rgba(16,24,40,.18); opacity: 0; transition: opacity .12s; }
  #tip.show { opacity: 1; }


  #dash-login { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: rgba(255,255,255,.96); }
  #dash-login form { display: grid; gap: 10px; width: min(300px, calc(100vw - 32px)); padding: 24px; border: 1px solid var(--line);
                     border-radius: var(--radius); background: #fff; box-shadow: 0 12px 32px rgba(16,24,40,.08); }
  #dash-login input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; }
  #dash-login input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  #dash-login button { font: inherit; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 500; cursor: pointer; }
  #dash-login .err { margin: 0; color: var(--bad); font-size: 13px; }
  .state { padding: 40px 0; color: var(--ink-3); font-size: 14px; }
  .banner { border: 1px solid #f0d9ab; background: #fffaf0; color: var(--ink-2); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
  @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 28px; } }
  @media (max-width: 560px) { .top-in, main { padding-left: 16px; padding-right: 16px; } .cur { font-size: 34px; } .prev { font-size: 24px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><i></i>Petpooja <span>Payroll sales</span></div>
    <nav aria-label="Pages">
      <a href="index.html" class="on">Home</a>
      <a href="calling.html">Calling</a>
      <a href="diagnostics.html">Diagnostics</a>
      <a href="settings.html">Settings</a>
    </nav>
  </div>
</header>

<main>
  <div class="state" id="state">Loading…</div>
  <div class="banner" id="stale" hidden></div>
  <section id="hero" hidden>
    <div class="hero-top">
      <h1>North stars</h1>
      <div class="meta">
        <span id="periods"></span>
        <button class="i" type="button" aria-label="How the months compare" data-tip="Leads created in each window, each as it stood at midnight after its last day (rebuilt from the CRM's stage history), so both months have had the same time to move. Rebuilt nightly at 03:15 IST.">i</button>
        <div class="toggle" role="group" aria-label="Show as">
          <button type="button" data-mode="n" aria-pressed="true">Numbers</button>
          <button type="button" data-mode="p" aria-pressed="false">%</button>
        </div>
      </div>
    </div>
    <div class="changes" id="changes"><span class="changes-l">What changed</span></div>
  </section>

  <section class="grid" id="cards" hidden>
    <article class="card">
      <div class="card-h"><span class="team">Marketing</span>
        <button class="i" type="button" aria-label="About" data-tip="Marketing owns how many relevant leads come in. Leads created in the period, by deal created date.">i</button></div>
      <div class="stars">
        <div class="star" id="s-rel"></div>
        <div class="star" id="s-qual"></div>
        <div class="star" id="s-und-m"></div>
      </div>
      <div>
        <div class="tbl-h">Where the month's leads ended up
          <button class="i" type="button" aria-label="How this is split" data-tip="Every lead counted once, by the stage it was in at the snapshot. A lead that had a demo arranged stays relevant even if it fell back, so the rows below leave those leads out.">i</button></div>
        <table id="t-mkt"></table>
      </div>
    </article>

    <article class="card">
      <div class="card-h"><span class="team">Calling</span>
        <button class="i" type="button" aria-label="About" data-tip="Calling owns every lead until it is disposed: handed to the demo team, handed to a payroll field team, or concluded as Not interested, Irrelevant or No response. Same leads as the marketing card.">i</button></div>
      <div class="stars">
        <div class="star" id="s-und"></div>
        <div class="star" id="s-conv"></div>
      </div>
      <div>
        <div class="tbl-h">Where the month's leads are, by stage
          <button class="i" type="button" aria-label="How this is split" data-tip="The period's leads by the stage they were in at the snapshot. Leads that had a demo arranged and fell back count under With calling, because calling has to dispose of them again.">i</button></div>
        <table id="t-call"></table>
      </div>
    </article>
  </section>

  <footer id="foot"></footer>
</main>

<div id="tip" role="tooltip"></div>

<script src="api.js"></script>
<script>
// Live data: team-dashboard?view=home -> the newest nightly funnel snapshot
// (each month as it stood at midnight after its last day) and its partitions
// from private.home_summary. Arrays are [previous, current].
let D = null;

// Context chips, shown when their dates overlap either window (edit by hand).
// [from, to, label, text]
const CHANGES = [
  ["2026-08-21", "2026-09-25", "Dialer · 21 Aug – 25 Sep", "Attempt limit not enforced: leads were redialled beyond policy and rarely rolled over to No response."],
  ["2026-09-25", "2026-09-25", "Dialer · 25 Sep", "Attempt-limit fix shipped: 3 missed attempts, then No response."],
  ["2026-10-01", "2026-10-14", "Team · 1–14 Oct", "Reps moved 783 leads to No response by hand in 1–14 Oct, against 226 in 1–14 Sep."],
  ["2026-10-01", "2026-10-31", "Lead sources · Oct", "The source lead_ad stopped appearing; its leads now arrive as Paid Social."],
  ["2026-10-01", "2026-10-31", "Team · Oct", "Six reps were active for the first time."],
  ["2026-10-02", "2026-10-02", "Calendar · 2 Oct", "Gandhi Jayanti."],
  ["2026-10-12", "2026-10-13", "Dialer · 12–13 Oct", "Push outage: new leads were not sent to the dialer for about 15 hours."],
  ["2026-10-16", "2026-10-16", "Dialer · 16 Oct", "Warm-list retirement: about 4,000 open leads moved to No response in one automated run."],
];

function build(d) {
  const P = d.summary.previous || {}, C = d.summary.current || {};
  const v = (sec, ks) => [P, C].map((o) => ks.reduce((s, k) => s + ((o[sec] || {})[k] || 0), 0));
  const sub = (sec, name, ks) => [name, ...v(sec, ks)];
  const per = d.periods;
  return {
    periods: { previous: dash.range(per.previous.first_day, per.previous.last_day), current: dash.range(per.current.first_day, per.current.last_day) },
    windows: per,
    total: [P.total || 0, C.total || 0],
    mkt: [
      { name: "Relevant", v: v("mkt", ["rel_demo", "rel_fellback", "rel_cold", "rel_quote", "rel_field"]),
        sub: [sub("mkt", "Demo arranged or later", ["rel_demo"]), sub("mkt", "Demo arranged earlier, then fell back", ["rel_fellback"]),
              sub("mkt", "Cold / not interested", ["rel_cold"]), sub("mkt", "Quotation sent", ["rel_quote"]),
              sub("mkt", "Handed to a payroll field team", ["rel_field"])] },
      { name: "Not relevant", v: v("mkt", ["irr", "nr"]), sub: [sub("mkt", "Irrelevant", ["irr"]), sub("mkt", "No response", ["nr"])] },
      { name: "Not decided yet", tip: "Still with calling and never past a conversation: Inbound, Call not connected or Callback requested.",
        v: v("mkt", ["und_inbound", "und_cnc", "und_cb"]),
        sub: [sub("mkt", "Inbound", ["und_inbound"]), sub("mkt", "Call not connected", ["und_cnc"]), sub("mkt", "Callback requested", ["und_cb"])] },
      { name: "Outside payroll", tip: "Moved to POS or to another pipeline: a lead for another product, not for payroll.", v: v("mkt", ["outside"]) },
    ],
    call: [
      { name: "With calling (undisposed)", v: v("call", ["call_inbound", "call_cnc", "call_cb", "call_quote"]),
        sub: [sub("call", "Inbound", ["call_inbound"]), sub("call", "Call not connected", ["call_cnc"]),
              sub("call", "Callback requested", ["call_cb"]), sub("call", "Quotation sent", ["call_quote"])] },
      { name: "Handed to demo team", v: v("call", ["demo_team"]) },
      { name: "Handed to another team", tip: "A payroll field team, POS or another pipeline.", v: v("call", ["another_team"]) },
      { name: "Concluded", tip: "Not interested, Irrelevant or No response at the snapshot.", v: v("call", ["concluded"]) },
    ],
    conv: { won: [P.won || 0, C.won || 0], concluded: [P.concluded || 0, C.concluded || 0] },
    changes: CHANGES.filter(([a, b]) => [per.previous, per.current].some((w) => a <= w.last_day && b >= w.first_day))
      .map(([a, b, label, text]) => [a <= per.current.last_day && b >= per.current.first_day, label, text]),
  };
}

let mode = "n";
const $ = (id) => document.getElementById(id);
const fInt = (x) => x.toLocaleString("en-IN");
const fPct = (x) => (x * 100).toFixed(1) + "%";
const sgn = (x) => (x > 0 ? "+" : x < 0 ? "−" : "±");
const fSigned = (x) => sgn(x) + fInt(Math.abs(x));
const fPts = (x) => sgn(x) + Math.abs(x).toFixed(1) + " pts";
const share = (x, i) => (D.total[i] ? x / D.total[i] : 0);

// north star: current big, previous a little smaller beside it, change below
function star(id, label, tip, cur, prev, fmt, change, better) {
  const good = change.value * better > 0;
  $(id).innerHTML =
    `<div class="star-l">${label} <button class="i" type="button" aria-label="Definition" data-tip="${tip}">i</button></div>` +
    `<div class="vals"><div><span class="cur">${fmt(cur)}</span><span class="per">${D.periods.current}</span></div>` +
    `<div><span class="prev">${fmt(prev)}</span><span class="per">${D.periods.previous}</span></div></div>` +
    `<div class="chg ${good ? "good" : "bad"}">${change.text}${change.note ? ` <small>${change.note}</small>` : ""}</div>`;
}

const RELTIP = "Every lead except those in Inbound, Callback requested, Call not connected, No response or Irrelevant, or moved to POS or another pipeline. A lead that had a demo arranged counts even if it later fell back.";
const NDTIP = "Leads still undisposed with calling, so their relevance isn't known yet: Inbound, Call not connected or Callback requested, as a share of all leads that came in. As calling decides them, relevant leads go up. Calling's undisposed count is slightly higher because it also includes Quotation sent and leads that fell back after a demo was arranged, which already count as relevant here.";
const SHARETIP = "Relevant leads ÷ leads that have been decided (relevant + not relevant). Leads calling hasn't decided yet, and leads moved outside payroll, are left out of both. No response counts as not relevant, so dialer changes that move leads to No response (the 21 Aug – 25 Sep attempt-limit bug, the 16 Oct warm-list retirement) move this number too.";
const UNDTIP = "Leads still in a calling stage at the snapshot: Inbound, Call not connected, Callback requested or Quotation sent. Lower is better.";
const CONVTIP = "Of the relevant leads calling has concluded (relevant leads minus those still in Quotation sent), the share with a demo arranged or closed. Not interested and hand-offs to a field team count as not converted. Counted per lead, not per call.";

function render() {
  for (const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  const [relP, relC] = D.mkt[0].v;
  const [undP, undC] = D.call[0].v;
  const convP = D.conv.concluded[0] ? D.conv.won[0] / D.conv.concluded[0] : 0, convC = D.conv.concluded[1] ? D.conv.won[1] / D.conv.concluded[1] : 0;
  // relevance among decided leads (user, 2026-10-19): relevant ÷ (relevant + not relevant)
  const [nrP, nrC] = D.mkt[1].v, decP = relP + nrP, decC = relC + nrC;
  const rsP = decP ? relP / decP : 0, rsC = decC ? relC / decC : 0;
  star("s-rel", "Relevant leads", RELTIP, relC, relP, fInt,
       { value: relC - relP, text: `${fSigned(relC - relP)} leads`, note: relP ? `${sgn(relC - relP)}${Math.abs((relC / relP - 1) * 100).toFixed(1)}%` : "" }, 1);
  star("s-qual", "Relevant share of decided leads", SHARETIP, rsC, rsP, fPct,
       { value: rsC - rsP, text: fPts((rsC - rsP) * 100), note: `${fInt(relC)} of ${fInt(decC)} decided leads` }, 1);
  const [ndP, ndC] = D.mkt.find((g) => g.name === "Not decided yet").v, nsP = share(ndP, 0), nsC = share(ndC, 1);
  star("s-und-m", "Undisposed (not decided yet)", NDTIP, nsC, nsP, fPct,
       { value: nsC - nsP, text: fPts((nsC - nsP) * 100), note: `${fInt(ndC)} of ${fInt(D.total[1])} leads · lower is better` }, -1);

  if (mode === "n") {
    star("s-und", "Undisposed leads", UNDTIP, undC, undP, fInt,
         { value: undC - undP, text: `${fSigned(undC - undP)} leads`, note: "lower is better" }, -1);
  } else {
    const uP = share(undP, 0), uC = share(undC, 1);
    star("s-und", "Undisposed leads", UNDTIP, uC, uP, fPct, { value: uC - uP, text: fPts((uC - uP) * 100), note: "of all leads, lower is better" }, -1);
  }
  star("s-conv", "Demo arranged rate", CONVTIP, convC, convP, fPct,
       { value: convC - convP, text: fPts((convC - convP) * 100), note: `${fInt(D.conv.won[1])} of ${fInt(D.conv.concluded[1])}` }, 1);

  const cell = (v, i) => (mode === "n" ? fInt(v) : fPct(share(v, i)));
  const chg = (p, c) => (mode === "n" ? fSigned(c - p) : fPts((share(c, 1) - share(p, 0)) * 100));
  const head = `<thead><tr><th></th><th>${D.periods.previous}</th><th>${D.periods.current}</th><th>Change</th></tr></thead>`;
  const totalRow = `<tr class="total"><td>Total leads</td><td>${mode === "n" ? fInt(D.total[0]) : "100%"}</td><td>${mode === "n" ? fInt(D.total[1]) : "100%"}</td>` +
                   `<td class="c">${mode === "n" ? fSigned(D.total[1] - D.total[0]) : "—"}</td></tr>`;

  const groups = (G) => G.map((g) => `<tr class="main"><td${g.tip ? ` data-tip="${g.tip}"` : ""}>${g.name}</td><td>${cell(g.v[0], 0)}</td><td>${cell(g.v[1], 1)}</td><td class="c">${chg(g.v[0], g.v[1])}</td></tr>` +
      (g.sub || []).map(([n, p, c]) => `<tr class="sub"><td>${n}</td><td>${cell(p, 0)}</td><td>${cell(c, 1)}</td><td>${chg(p, c)}</td></tr>`).join("")).join("");
  $("t-mkt").innerHTML = head + "<tbody>" + groups(D.mkt) + totalRow + "</tbody>";

  $("t-call").innerHTML = head + "<tbody>" +
    D.call.map((g) => `<tr class="main"><td${g.tip ? ` data-tip="${g.tip}"` : ""}>${g.name}</td><td>${cell(g.v[0], 0)}</td><td>${cell(g.v[1], 1)}</td><td class="c">${chg(g.v[0], g.v[1])}</td></tr>` +
      (g.sub || []).map(([n, p, c]) => `<tr class="sub"><td>${n}</td><td>${cell(p, 0)}</td><td>${cell(c, 1)}</td><td>${chg(p, c)}</td></tr>`).join("")).join("") +
    totalRow + "</tbody>";
}

async function init() {
  let d;
  try { d = await dash.load({ view: "home" }); }
  catch (e) { $("state").textContent = `Couldn't load the data (${e.message}). Reload to try again.`; return; }
  if (d.empty) { $("state").textContent = "No snapshot yet: the nightly job hasn't run."; return; }
  D = build(d);
  $("periods").textContent = `${D.periods.current} vs ${D.periods.previous} · as of midnight after each`;
  for (const [cur, label, text] of D.changes) {
    const s = document.createElement("span");
    s.className = "chip" + (cur ? " now" : "");
    s.textContent = label;
    s.dataset.tip = text;
    $("changes").append(s);
  }
  if (!D.changes.length) $("changes").hidden = true;
  const yday = dash.addDays(dash.istToday(), -1);
  if (d.as_of < yday) {
    $("stale").hidden = false;
    $("stale").textContent = `Last night's snapshot is missing: showing ${dash.dm(d.as_of)}. The job retries at 04:15 and 06:15 IST.`;
  }
  $("foot").textContent = `Snapshot as of the end of ${dash.dm(d.as_of)} · built ${new Date(d.generated_at).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} IST`;
  $("state").hidden = true; $("hero").hidden = false; $("cards").hidden = false;
  render();
}
