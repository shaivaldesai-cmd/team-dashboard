<!DOCTYPE html>
<!-- Sales analytics page. Reads team-dashboard?view=sales, which serves the
     newest row of public.sales_snapshot. That table is filled out-of-band
     because the figures come from the CRM's Mongo, which edge functions can't
     reach (Atlas allowlist). Deploy: copy as sales.html into the
     team-dashboard Pages repo. -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sales Analytics — Petpooja Leads</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --border: #e4e3df; --row: #f6f6f4;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a897f;
    --accent: #2a78d6; --err: #e34948;
    --up: #1f7a45; --up-bg: #e6f4ea; --down: #b3261e; --down-bg: #fbe9e7; --flat-bg: #efefec;
    --gold: #b8860b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface: #1a1a19; --card: #232322; --border: #3a3936; --row: #2a2a28;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8a897f;
      --accent: #3987e5; --err: #e66767;
      --up: #6fd39a; --up-bg: #1d3327; --down: #f28b82; --down-bg: #3a2320; --flat-bg: #2f2f2d;
      --gold: #e2b23c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--surface); color: var(--ink);
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  .wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 22px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  header h1 { font-size: 20px; font-weight: 650; }
  nav { display: flex; gap: 14px; font-size: 14px; }
  nav a { color: var(--ink-3); text-decoration: none; }
  nav a.on { color: var(--ink); font-weight: 650; }
  header .sub { color: var(--ink-3); font-size: 13px; flex-basis: 100%; }

  .hero { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px;
          display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
  .hero .label { font-size: 13px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .hero .value { font-size: 60px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.05; margin: 6px 0 2px; }
  .hero .value .of { font-size: 30px; font-weight: 600; color: var(--ink-3); }
  .hero .sub2 { font-size: 14px; color: var(--ink-2); }
  .hero .chip { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
                margin-top: 10px; background: var(--flat-bg); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .hero .chip.up { background: var(--up-bg); color: var(--up); }
  .hero .chip.down { background: var(--down-bg); color: var(--down); }
  .bars { display: grid; gap: 10px; min-width: 0; }
  .barrow { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 12px; font-size: 13px; }
  .barrow .k { color: var(--ink-3); }
  .bartrack { position: relative; height: 26px; background: var(--row); border-radius: 6px; overflow: hidden; }
  .barfill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
  .barfill.act { background: var(--accent); }
  .barfill.exp { background: var(--ink-3); opacity: .45; }
  .barrow .v { font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 42px; text-align: right; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 8px 0 4px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--ink-3); font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; }
  thead th .dates { display: block; font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 11.5px; margin-top: 3px; }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--row); }
  td.name { font-size: 16px; font-weight: 600; }
  td.name .flag { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
                  color: var(--down); background: var(--down-bg); border-radius: 999px; padding: 2px 8px; margin-left: 8px; }
  td.pair b { font-size: 19px; font-weight: 700; }
  td.pair .vs { color: var(--ink-3); font-weight: 400; margin: 0 3px; }
  td.pair .exp { color: var(--ink-3); }
  td.pair .n { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }
  td.pair.hit b { color: var(--up); }
  td.pair.miss b { color: var(--down); }
  tfoot td { border-top: 2px solid var(--border); border-bottom: none; font-weight: 700; background: var(--row); }
  .note { font-size: 13px; color: var(--ink-3); padding: 12px 18px 10px; }
  footer { font-size: 12.5px; color: var(--ink-3); }
  footer a { color: var(--accent); }
  #banner { display: none; background: var(--down-bg); color: var(--down); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  #app.busy { opacity: .55; transition: opacity .15s; }
  #login { display: none; place-items: center; min-height: 70vh; }
  #login form { display: grid; gap: 10px; width: 260px; padding: 24px; background: var(--card);
                border: 1px solid var(--border); border-radius: 10px; }
  #login input { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: inherit; font: inherit; }
  #login button { padding: 8px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font: inherit; }
  .err { color: var(--err); font-size: 13px; }
  #app { display: none; }
  @media (max-width: 720px) {
    body { padding: 14px; }
    .hero { grid-template-columns: 1fr; gap: 18px; } .hero .value { font-size: 46px; }
  }
</style>
</head><body>

<div id="login"><form id="loginForm">
  <div style="font-weight:650">Team dashboard</div>
  <div class="err" id="loginErr" hidden>Wrong username or password.</div>
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <button type="submit">Open dashboard</button>
</form></div>

<div id="app"><div class="wrap">
  <header>
    <h1>Sales Analytics</h1>
    <nav><a href="./">Overview</a><a href="./telecallers.html">Telecallers</a><a href="./northstar.html">North Star</a><a class="on" href="./sales.html">Sales</a></nav>
    <div class="sub" id="asof">Loading…</div>
  </header>

  <div id="banner"></div>

  <div class="hero" id="hero"></div>

  <div class="card">
    <table id="tbl">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
    <div class="note" id="note"></div>
  </div>

  <footer id="foot"></footer>
</div></div>

<script>
const API = "https://xuerxrbtofhxdwxglynr.supabase.co/functions/v1/team-dashboard";
const LS = "petpooja_dash_creds";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmtDay = (iso) => new Date(iso + "T00:00:00+05:30").toLocaleDateString("en-IN",
  { timeZone: "Asia/Kolkata", day: "numeric", month: "short" });
const COLS = [["week", "Last week"], ["fortnight", "Last fortnight"], ["month", "Last month"]];

function creds() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("key")) { localStorage.setItem(LS, JSON.stringify({ key: h.get("key") })); h.delete("key"); location.hash = h.toString(); }
  try { return JSON.parse(localStorage.getItem(LS)) || null; } catch { return null; }
}
function show(id) {
  $("login").style.display = id === "login" ? "grid" : "none";
  $("app").style.display = id === "app" ? "block" : "none";
}

const state = { d: null, sortKey: "month", sortDir: -1 };

function renderHero(d) {
  const t = d.today, pct = t.demos ? (100 * t.actual / t.demos) : 0;
  const diff = t.actual - t.expected;
  const cls = diff >= 0 ? "up" : "down";
  const maxBar = Math.max(t.demos, 1);
  $("hero").innerHTML = `
    <div>
      <div class="label">Closed today, from today's demos</div>
      <div class="value">${t.actual}<span class="of"> / ${Math.round(t.expected)}</span></div>
      <div class="sub2">${t.actual} of today's ${t.demos} demos closed the same day.
        At the ${t.benchmark}% benchmark that should be ${Math.round(t.expected)}.</div>
      <span class="chip ${cls}">${diff >= 0 ? "+" : ""}${Math.round(diff * 10) / 10} vs benchmark · ${Math.round(pct * 10) / 10}% rate</span>
    </div>
    <div class="bars">
      <div class="barrow"><span class="k">Demos today</span>
        <div class="bartrack"><div class="barfill exp" style="width:100%"></div></div>
        <span class="v">${t.demos}</span></div>
      <div class="barrow"><span class="k">Expected @ ${t.benchmark}%</span>
        <div class="bartrack"><div class="barfill exp" style="width:${100 * t.expected / maxBar}%"></div></div>
        <span class="v">${Math.round(t.expected)}</span></div>
      <div class="barrow"><span class="k">Closed</span>
        <div class="bartrack"><div class="barfill act" style="width:${100 * t.actual / maxBar}%"></div></div>
        <span class="v">${t.actual}</span></div>
    </div>`;
}

function cell(o) {
  if (!o || !o.demos) return `<td class="pair"><span class="exp">—</span></td>`;
  const cls = o.actual >= o.expected ? "hit" : "miss";
  return `<td class="pair ${cls}"><b>${o.actual}</b><span class="vs">vs</span><span class="exp">${Math.round(o.expected)}</span>
    <span class="n">${o.demos} demos · ${Math.round(1000 * o.actual / o.demos) / 10}%</span></td>`;
}

function renderTable(d) {
  $("thead").innerHTML = `<th class="sortable" data-k="name">Salesperson</th>` +
    COLS.map(([k, lbl]) => {
      const w = d.windows[k];
      return `<th class="sortable" data-k="${k}">${esc(lbl)}
        <span class="dates">${fmtDay(w.from)} – ${fmtDay(w.to)} · expect ${w.rate}%</span></th>`;
    }).join("");

  const rows = d.rows.slice().sort((a, b) => {
    if (state.sortKey === "name") return state.sortDir * a.name.localeCompare(b.name);
    const k = state.sortKey;
    const av = a[k].actual - a[k].expected, bv = b[k].actual - b[k].expected;
    return state.sortDir * (av - bv);
  });
  $("tbody").innerHTML = rows.map((r) => {
    const stalled = COLS.every(([k]) => r[k].demos >= 20 && r[k].actual === 0);
    return `<tr><td class="name">${esc(r.name)}${stalled ? `<span class="flag">stalled</span>` : ""}</td>` +
      COLS.map(([k]) => cell(r[k])).join("") + `</tr>`;
  }).join("");

  $("tfoot").innerHTML = `<tr><td class="name">Team</td>` +
    COLS.map(([k]) => cell(d.team[k])).join("") + `</tr>`;

  document.querySelectorAll("#thead th").forEach((th) => {
    th.tabIndex = 0;
    const go = () => {
      const k = th.dataset.k;
      if (k === state.sortKey) state.sortDir *= -1;
      else { state.sortKey = k; state.sortDir = k === "name" ? 1 : -1; }
      renderTable(state.d);
    };
    th.addEventListener("click", go);
    th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

function render(d) {
  state.d = d;
  renderHero(d);
  renderTable(d);
  $("note").innerHTML =
    `Each cell is closures banked so far <b>vs</b> what the closure curve expects by now. ` +
    `Expected assumes a ${d.base_rate}% eventual conversion — the rate implied by the ${d.today.benchmark}% same-day benchmark — ` +
    `matured to ${d.windows.week.maturity}% at a week, ${d.windows.fortnight.maturity}% at a fortnight and ${d.windows.month.maturity}% at a month. ` +
    `Demos are credited to the salesperson who gave them; a telecaller owning the deal at demo time is treated as a transfer artifact.`;
  $("foot").innerHTML =
    `Payroll pipeline only. Ownership history begins 20 July 2026. ` +
    `Callers: <a href="./telecallers.html">Telecallers</a> · <a href="./northstar.html">North Star</a> · <a href="./">Overview</a>.`;
}

async function load(fromLogin) {
  const c = creds();
  if (!c) { show("login"); return; }
  const auth = c.key ? `key=${encodeURIComponent(c.key)}` : `user=${encodeURIComponent(c.user)}&pass=${encodeURIComponent(c.pass)}`;
  $("app").classList.add("busy");
  let res = null, err = null;
  try {
    res = await fetch(`${API}?${auth}&view=sales`).then((x) => x.json());
    if (!res.ok) err = res.error || "error";
  } catch { err = "network error"; }
  $("app").classList.remove("busy");
  if (err === "unauthorized") { localStorage.removeItem(LS); $("loginErr").hidden = !fromLogin; show("login"); return; }
  if (err) {
    if (!state.d) { show("login"); return; }
    $("banner").textContent = `Could not refresh: ${err}.`; $("banner").style.display = "block"; show("app"); return;
  }
  $("banner").style.display = "none";
  if (res.empty || !res.data) {
    show("app");
    $("asof").textContent = "No snapshot loaded yet.";
    $("banner").textContent = "No sales snapshot has been written yet.";
    $("banner").style.display = "block";
    return;
  }
  render(res.data);
  const snap = new Date(res.snapshot_at);
  $("asof").textContent = `Snapshot ${snap.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })} IST · payroll deals`;
  show("app");
}

$("loginForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  localStorage.setItem(LS, JSON.stringify({ user: $("u").value.trim(), pass: $("p").value }));
  load(true);
});
load(false);
setInterval(() => load(false), 5 * 60 * 1000);
</script>
</body></html>
